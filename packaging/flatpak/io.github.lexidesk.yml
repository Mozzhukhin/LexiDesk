id: io.github.lexidesk
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.9'
command: lexidesk

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-config/LexiDesk:create
  - --filesystem=xdg-data/LexiDesk:create

modules:
  - python3-dependencies.json
  - name: lexidesk
    buildsystem: simple
    build-commands:
      - install -d /app/lib/python3.12/site-packages
      - cp -a src/lexidesk /app/lib/python3.12/site-packages/
      - find /app/lib/python3.12/site-packages/lexidesk -type d
        -name __pycache__ -prune -exec rm -r {} +
      - install -Dm755 packaging/flatpak/lexidesk /app/bin/lexidesk
      - install -Dm644 packaging/io.github.lexidesk.desktop
        /app/share/applications/io.github.lexidesk.desktop
      - install -Dm644 packaging/io.github.lexidesk.metainfo.xml
        /app/share/metainfo/io.github.lexidesk.metainfo.xml
      - install -Dm644 assets/lexidesk.svg
        /app/share/icons/hicolor/scalable/apps/io.github.lexidesk.svg
    sources:
      - type: dir
        path: ../..
        skip:
          - .venv
          - .mypy_cache
          - .pytest_cache
          - .ruff_cache
          - build
          - dist

cleanup-commands:
  - /app/cleanup-BaseApp.sh
