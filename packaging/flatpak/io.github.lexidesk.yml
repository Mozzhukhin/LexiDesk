id: io.github.lexidesk
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.9'
command: lexidesk

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-config/LexiDesk:create
  - --filesystem=xdg-data/LexiDesk:create

modules:
  # CPU-only PyTorch wheels live in PyTorch's index rather than PyPI, so they
  # are pinned separately from the generated dependency manifest.
  - name: python3-torch-cpu
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps *.whl
    sources:
      - type: file
        url: https://download-r2.pytorch.org/whl/cpu/torch-2.13.0%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl
        sha256: 4ca4a9394b0c771238a4f73590fdbbc4debad85ed0fa63d026ae1b085da7d6e2
        only-arches:
          - x86_64
      - type: file
        url: https://download-r2.pytorch.org/whl/cpu/torch-2.13.0%2Bcpu-cp312-cp312-manylinux_2_28_aarch64.whl
        sha256: 6f307c2c32d764ffc6ff6893b801fad6d4752f3e67966cb8abf1843427c02604
        only-arches:
          - aarch64
  - python3-dependencies.json
  - name: lexidesk
    buildsystem: simple
    build-commands:
      - install -d /app/lib/python3.12/site-packages
      - cp -a src/lexidesk /app/lib/python3.12/site-packages/
      - find /app/lib/python3.12/site-packages/lexidesk -type d
        -name __pycache__ -prune -exec rm -r {} +
      - install -Dm755 packaging/flatpak/lexidesk /app/bin/lexidesk
      - install -Dm644 packaging/io.github.lexidesk.desktop
        /app/share/applications/io.github.lexidesk.desktop
      - install -Dm644 packaging/io.github.lexidesk.metainfo.xml
        /app/share/metainfo/io.github.lexidesk.metainfo.xml
      - install -Dm644 assets/lexidesk.svg
        /app/share/icons/hicolor/scalable/apps/io.github.lexidesk.svg
    sources:
      - type: dir
        path: ../..
        skip:
          - .venv
          - .mypy_cache
          - .pytest_cache
          - .ruff_cache
          - build
          - dist

cleanup-commands:
  - /app/cleanup-BaseApp.sh
