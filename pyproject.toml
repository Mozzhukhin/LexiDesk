[project]
name = "lexidesk"
version = "1.2.0"
description = "A multilingual offline vocabulary widget for Windows and Linux"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "LexiDesk contributors" }]
dependencies = [
    "ctranslate2>=4,<5",
    "fsrs>=6.3,<7",
    "platformdirs>=4.3",
    "pyside6-essentials>=6.10",
    "sentencepiece>=0.2,<0.3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17",
    "pytest>=9",
    "pytest-cov>=7",
    "ruff>=0.12",
]
bundle = [
    "pyinstaller>=6.16,<7",
]
data-build = [
    "nltk>=3.9,<4",
]

[project.scripts]
lexidesk = "lexidesk.main:main"
lexidesk-cli = "lexidesk.cli:main"
lexidesk-service = "lexidesk.service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lexidesk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=lexidesk --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true
source = ["lexidesk"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
files = ["src/lexidesk"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
