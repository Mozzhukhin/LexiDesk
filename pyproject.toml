[project]
name = "lexidesk"
version = "1.1.0"
description = "An offline English-Russian vocabulary widget for Windows and Linux"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "LexiDesk contributors" }]
dependencies = [
    "argostranslate>=1.11.0",
    "fsrs>=6.3,<7",
    "nltk>=3.9,<4",
    "platformdirs>=4.3",
    "pyside6-essentials>=6.10",
    "spacy==3.8.13; python_version >= '3.14'",
    "stanza>=1.12.2",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17",
    "pytest>=9",
    "pytest-cov>=7",
    "ruff>=0.12",
]
bundle = [
    "pyinstaller>=6.16,<7",
]

[project.scripts]
lexidesk = "lexidesk.main:main"
lexidesk-cli = "lexidesk.cli:main"
lexidesk-service = "lexidesk.service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lexidesk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=lexidesk --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true
source = ["lexidesk"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
files = ["src/lexidesk"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.uv]
# Argos Translate 1.11 pins an unsafe Stanza release. Stanza keeps the public
# Pipeline API compatible, so use the security-fixed release until Argos lifts
# its exact dependency pin.
override-dependencies = ["stanza>=1.12.2"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
