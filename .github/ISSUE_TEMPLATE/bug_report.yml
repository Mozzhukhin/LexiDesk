name: Bug report
description: Report a reproducible LexiDesk problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and what actually happened.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Arch Linux, Plasma 6.x, Wayland
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
